<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>授权 · XAI Connect</title>
  <link rel="icon" type="image/svg+xml" href="{{assetURL "favicon.svg"}}">
  <link rel="stylesheet" href="{{assetURL "consent.css"}}">
</head>
<body>
<main class="consent-shell">
  <section class="consent-card" aria-labelledby="consent-title">
    <a class="consent-brand" href="https://xai.run" target="_blank" rel="noreferrer">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l6.3 7L5 19m14-14l-6.3 7L19 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span><span class="brand-name">XAI Connect</span><span class="brand-subtitle">xai.run 身份授权</span></span>
    </a>
    <h1 id="consent-title"><strong>{{.Client.Name}}</strong> 请求访问你的 xai.run 账号</h1>
    <p class="lead">确认后，{{.Client.Name}} 将使用你的 xai.run 身份完成登录。应用不会看到你的密码。</p>
    <section class="permission-panel" aria-labelledby="permission-title">
      <div class="permission-heading">
        <h2 id="permission-title">该应用将获得以下权限</h2>
        <span>{{len .Scopes}} 项</span>
      </div>
      <ul class="scope-list">{{range .Scopes}}<li class="scope-item"><code>{{.}}</code></li>{{end}}</ul>
    </section>
    <form class="consent-form" method="post" action="{{.Action}}">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <label class="remember"><input type="checkbox" name="remember" value="1">下次不再询问此应用</label>
      <div class="consent-actions">
        <button class="button button-secondary" name="decision" value="deny" type="submit">拒绝</button>
        <button class="button" name="decision" value="allow" type="submit">允许访问</button>
      </div>
    </form>
  </section>
  <p class="consent-foot">授权由 <a href="https://xai.run" target="_blank" rel="noreferrer">xai.run</a> 提供身份验证</p>
</main>
</body>
</html>
