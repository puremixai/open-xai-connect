<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>授权 · XAI Connect</title>
  <style>
    :root { color-scheme: light; --ink: #17212b; --ink-soft: #526171; --muted: #758395; --line: #dbe2e9; --surface: #f4f6f8; --panel: #fff; --nav: #101820; --nav-muted: #9eacb8; --accent: #f6821f; --accent-hover: #ff9a45; --accent-strong: #a94700; --accent-wash: #fff1e5; --success: #087f5b; --success-wash: #e6f6ef; --radius: 10px; --radius-sm: 6px; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --ink: #f0f4f7; --ink-soft: #bdc8d1; --muted: #8d9ba8; --line: #2c3944; --surface: #111920; --panel: #18232c; --nav: #0c1218; --nav-muted: #9aa9b5; --accent: #f59b52; --accent-hover: #ffb473; --accent-strong: #ffc18d; --accent-wash: #3b2a1e; --success: #64d2a6; --success-wash: #173d35; } }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--surface); }
    body { min-height: 100dvh; margin: 0; color: var(--ink); background: var(--surface); font: 14px/1.55 "Aptos", "Segoe UI Variable", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button, input { font: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 3px; }
    .consent-shell { display: grid; place-items: center; min-height: 100dvh; padding: 38px 20px; }
    .consent-card { display: grid; grid-template-columns: minmax(190px, .42fr) minmax(0, 1fr); width: min(860px, 100%); min-height: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .consent-aside { display: flex; flex-direction: column; padding: 29px 25px; color: #edf2f5; background: var(--nav); }
    .consent-brand { display: inline-flex; align-items: center; gap: 11px; color: inherit; text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; color: #18232c; background: var(--accent); border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; }
    .brand-name { display: block; font-size: 15px; font-weight: 600; }
    .brand-subtitle { display: block; margin-top: -2px; color: var(--nav-muted); font-size: 11px; }
    .consent-aside-copy { margin-top: auto; }
    .consent-aside-copy .aside-kicker { margin: 0 0 10px; color: #ffb77d; font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; font-size: 11px; }
    .consent-aside-copy h2 { max-width: 13ch; margin: 0 0 10px; color: #fff; font-size: 25px; line-height: 1.15; font-weight: 600; letter-spacing: -.025em; }
    .consent-aside-copy p { max-width: 24ch; margin: 0; color: var(--nav-muted); font-size: 13px; }
    .consent-aside-foot { margin-top: 30px; color: #71818d; font-size: 11px; }
    .consent-body { padding: 32px 35px 29px; }
    .consent-step { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; color: var(--muted); font-size: 11px; }
    .consent-step span { display: grid; place-items: center; width: 22px; height: 22px; color: var(--accent-strong); background: var(--accent-wash); border-radius: 50%; font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; font-size: 10px; }
    .eyebrow { margin: 0 0 9px; color: var(--accent-strong); font-size: 11px; font-weight: 500; }
    h1 { max-width: 19ch; margin: 0 0 10px; color: var(--ink); font-size: clamp(27px, 4vw, 37px); line-height: 1.12; font-weight: 600; letter-spacing: -.03em; text-wrap: balance; }
    .lead { max-width: 56ch; margin: 0 0 27px; color: var(--ink-soft); }
    .permission-panel { padding: 17px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); }
    .permission-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 11px; }
    .permission-heading h2 { margin: 0; color: var(--ink); font-size: 14px; font-weight: 600; }
    .permission-heading span { color: var(--muted); font-size: 11px; }
    .scope-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .scope-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; }
    .scope-item::before { display: grid; place-items: center; width: 18px; height: 18px; color: var(--success); background: var(--success-wash); border-radius: 50%; content: "✓"; font-size: 11px; }
    .scope-item code { overflow-wrap: anywhere; font: 12px/1.3 "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
    .consent-form { margin-top: 25px; }
    .consent-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .remember { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 12px; cursor: pointer; }
    .remember input { width: 15px; height: 15px; accent-color: var(--accent-strong); }
    .consent-actions { display: flex; gap: 9px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 41px; padding: 0 16px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; }
    .button:hover { color: var(--accent-strong); background: var(--surface); }
    .button:active { transform: translateY(1px); }
    .button-primary { color: #17212b; background: var(--accent); border-color: var(--accent); }
    .button-primary:hover { color: #17212b; background: var(--accent-hover); border-color: var(--accent-hover); }
    @media (max-width: 650px) {
      .consent-shell { padding: 16px; }
      .consent-card { display: block; min-height: 0; }
      .consent-aside { min-height: 184px; padding: 20px; }
      .consent-aside-copy { margin-top: 27px; }
      .consent-aside-copy h2 { max-width: none; font-size: 21px; }
      .consent-aside-copy p, .consent-aside-foot { display: none; }
      .consent-body { padding: 24px 19px 20px; }
      .consent-footer { align-items: stretch; flex-direction: column; }
      .consent-actions, .consent-actions .button { width: 100%; }
      .consent-actions .button { flex: 1; }
    }
  </style>
</head>
<body>
<main class="consent-shell">
  <section class="consent-card" aria-labelledby="consent-title">
    <aside class="consent-aside">
      <a class="consent-brand" href="https://xai.run" target="_blank" rel="noreferrer"><span class="brand-mark" aria-hidden="true">XC</span><span><span class="brand-name">XAI Connect</span><span class="brand-subtitle">安全身份授权</span></span></a>
      <div class="consent-aside-copy"><p class="aside-kicker">xai.run identity</p><h2>你正在授权一个外部应用</h2><p>确认前请核对应用名称和权限范围。你的密码不会提供给应用。</p></div>
      <div class="consent-aside-foot">Powered by xai.run</div>
    </aside>
    <div class="consent-body">
      <div class="consent-step"><span>1</span><span>确认应用请求</span></div>
      <p class="eyebrow">授权请求</p>
      <h1 id="consent-title">{{.Client.Name}} 请求访问你的账号</h1>
      <p class="lead">确认后，{{.Client.Name}} 将使用你的 xai.run 身份完成登录。应用不会看到你的密码。</p>
      <section class="permission-panel" aria-labelledby="permission-title">
        <div class="permission-heading"><h2 id="permission-title">该应用将获得以下权限</h2><span>{{len .Scopes}} 项权限</span></div>
        <ul class="scope-list">{{range .Scopes}}<li class="scope-item"><code>{{.}}</code></li>{{end}}</ul>
      </section>
      <form class="consent-form" method="post" action="{{.Action}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="consent-footer">
          <label class="remember"><input type="checkbox" name="remember" value="1">下次不再询问此应用</label>
          <div class="consent-actions"><button class="button" name="decision" value="deny" type="submit">拒绝</button><button class="button button-primary" name="decision" value="allow" type="submit">允许访问</button></div>
        </div>
      </form>
    </div>
  </section>
</main>
</body>
</html>
