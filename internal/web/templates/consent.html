<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>授权 · XAI Connect</title><style>body{font:16px system-ui,sans-serif;max-width:620px;margin:3rem auto;padding:0 1rem;color:#17202a}section{border:1px solid #d9e0e7;border-radius:.6rem;padding:1.25rem}button{padding:.65rem 1rem;border:0;border-radius:.45rem;background:#1769e0;color:#fff}button[name=decision]{background:#66727f}</style></head>
<body><main><section><h1>{{.Client.Name}} 请求访问</h1><p>该应用将获得以下权限：</p><ul>{{range .Scopes}}<li>{{.}}</li>{{end}}</ul><form method="post" action="{{.Action}}"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button name="decision" value="allow">允许</button> <button name="decision" value="deny">拒绝</button></form></section></main></body></html>
