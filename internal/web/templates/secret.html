{{template "portal-page-start" .}}

<section class="page-header">
  <div>
    <p class="eyebrow">凭证管理</p>
    <h1>Client Secret</h1>
    <p class="lead">这是一次性敏感操作视图。请立即保存到服务端密钥管理系统，并避免出现在日志、浏览器或代码仓库中。</p>
  </div>
  <a class="button button-secondary" href="/connect/apps/{{.ID}}">返回应用</a>
</section>

<section class="panel secret-panel">
  <h2>你的 Client Secret</h2>
  <p class="muted">仅在当前页面显示。若怀疑已经泄露，请立即回到应用详情执行轮换。</p>
  <code class="secret-value">{{.Secret}}</code>
  <div class="button-row"><a class="button" href="/connect/apps/{{.ID}}">我已保存，返回应用</a></div>
</section>

<footer class="portal-footer"><span>Secret 不会通过 OIDC 返回给最终用户</span><a href="https://github.com/puremixai/xai-connect" target="_blank" rel="noreferrer">查看安全说明</a></footer>

{{template "portal-page-end" .}}
