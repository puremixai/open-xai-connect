<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核队列 · XAI Connect</title><style>body{font:16px system-ui,sans-serif;max-width:1000px;margin:3rem auto;padding:0 1rem;color:#17202a}article{border:1px solid #d9e0e7;border-radius:.6rem;padding:1rem;margin:1rem 0}button{padding:.55rem .8rem;border:0;border-radius:.4rem;background:#1769e0;color:#fff}textarea{width:100%;min-height:4rem}</style></head>
<body><main><h1>应用审核</h1>{{range .Apps}}<article><h2>{{.Name}}</h2><p>{{.Description}}</p><p>所有者：{{.OwnerSubject}}</p><form method="post" action="/connect/review/{{.ID}}"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><textarea name="reason" required placeholder="审核理由"></textarea><button name="decision" value="approve">批准并上线</button> <button name="decision" value="changes">要求修改</button> <button name="decision" value="reject">驳回</button></form></article>{{else}}<p>当前没有待审核应用。</p>{{end}}</main></body></html>
