<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>{{.Title}} · XAI Connect</title>
  <link rel="stylesheet" href="/connect/assets/error.css">
</head>
<body>
<main class="error-shell">
  <section class="error-card" aria-labelledby="error-title">
    <a class="error-brand" href="/connect/apps">
      <span class="brand-mark" aria-hidden="true">XC</span>
      <span><span class="brand-name">XAI Connect</span><span class="brand-subtitle">身份与应用控制台</span></span>
    </a>
    <div class="error-code">请求未完成</div>
    <h1 id="error-title">{{.Title}}</h1>
    <p class="error-message">{{.Message}}</p>
    <a class="error-action" href="{{.Back}}">返回上一页</a>
  </section>
</main>
</body>
</html>
