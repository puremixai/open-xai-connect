<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{{.Title}} · PureConnect</title>
  <link rel="icon" type="image/svg+xml" href="{{assetURL "favicon.svg"}}">
  <link rel="stylesheet" href="{{assetURL "error.css"}}">
</head>
<body>
<main class="error-shell">
  <section class="error-card" aria-labelledby="error-title">
    <a class="error-brand" href="/connect/apps">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 19V5h6a4 4 0 0 1 0 8H7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span><span class="brand-name">PureConnect</span><span class="brand-subtitle">身份与应用控制台</span></span>
    </a>
    <div><span class="error-code">请求未完成</span></div>
    <h1 id="error-title">{{.Title}}</h1>
    <p class="error-message">{{.Message}}</p>
    <a class="button" href="{{.Back}}">返回上一页</a>
  </section>
</main>
</body>
</html>
