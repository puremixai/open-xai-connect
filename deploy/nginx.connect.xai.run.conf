server {
    listen 443 ssl http2;
    server_name connect.xai.run;

    # Supply certificates through the host's certificate manager.
    ssl_certificate     /etc/nginx/ssl/xai.run.pem;
    ssl_certificate_key /etc/nginx/ssl/xai.run.key;

    client_max_body_size 600k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # OAuth, login, consent, UserInfo, revoke and Secret responses must not be cached.
    location ~ ^/(oauth2|userinfo|connect/(login|callback|consent|logout|apps|review)|\.well-known)/ {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 80;
    server_name connect.xai.run;
    return 301 https://$host$request_uri;
}
